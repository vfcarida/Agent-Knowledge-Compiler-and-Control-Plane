apiVersion: policy.akcp.dev/v1alpha1
kind: PolicyCard
metadata:
  name: "autonomous_actions"
  description: "Rejects autonomous actions for refunds and account changes"
appliesTo:
  capabilities:
    - customer-support.issue_refund
    - customer-support.delete_account
    - customer-support.change_account
  riskLevels: ["high", "critical"]
rules:
  - effect: deny
