apiVersion: policy.akcp.dev/v1alpha1
kind: PolicyCard
metadata:
  name: "deploy_service"
  description: "Controls the ability to deploy a new version of a service."
appliesTo:
  capabilities: ["it-operations.deploy_service"]
  riskLevels: ["critical"]
rules:
  - effect: require_approval
evidence:
  required: ["serviceName", "environment", "version", "approver"]
# Not yet representable in PolicyCardSchema, kept here for operators: approval
# token TTL (60 min), payload-hash binding, and single-use enforcement are
# configured at the ApprovalStore level (see mcp-automation-server/src/
# approval/), not per-policy — this file can't currently override them.
