apiVersion: policy.akcp.dev/v1alpha1
kind: PolicyCard
metadata:
  name: "execute_remediation"
  description: >
    Controls the agent's ability to execute remediation actions (rollbacks, restarts, configuration
    changes) against production services. This is the highest-risk capability in the IT Ops domain.
    The agent may SUGGEST remediation but MUST obtain explicit human approval before executing.
appliesTo:
  capabilities: ["it-operations.execute_remediation"]
  riskLevels: ["critical"]
rules:
  - effect: require_approval
evidence:
  required:
    - "remediationActionId"
    - "serviceRef"
    - "approvalTicketId"
    - "approvedBy"
    - "approvedAt"
    - "executedAt"
    - "status"
# Not yet enforced by the policy engine — kept here as operator guidance
# pending a real "structured pre-condition"/"forbidden pattern" enforcement
# feature (see docs/specs/policy-cards.md for the current PolicyCard spec):
#
# approval: { ttlMinutes: 10, bindToPayloadHash: true, singleUse: true,
#             approverRoles: [on-call-lead, engineering-manager] }
# contextRequirements:
#   - incidentId must be provided and must reference an open incident
#   - approvalTicketId must be present and valid
#   - remediationActionId must reference a known RemediationAction document
# safety.neverExecuteWhen:
#   - environment == production AND changeWindow.active == false AND incidentSeverity > SEV-2
# safety.logMustNotContain: [credential, password, secret, token]
