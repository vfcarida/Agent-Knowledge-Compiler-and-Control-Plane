services:
  # AKCP Control Plane Dashboard BFF & Gateway
  akcp-control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    image: akcp/control-plane:latest
    ports:
      - "3001:3001"
      - "8080:8080"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    command:
      [
        "node",
        "packages/cli/dist/index.js",
        "serve",
        "dashboard",
        "--host",
        "0.0.0.0",
        "--port",
        "3001",
        "--bundle",
        "examples/domains/it-operations",
      ]
    restart: unless-stopped

  # High-throughput Rate Limiting and Session Store
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: OpenTelemetry Collector for local observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    ports:
      - "4317:4317" # gRPC OTLP
      - "4318:4318" # HTTP OTLP
      - "8889:8889" # Prometheus metrics
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    profiles:
      - observability

  # Optional: Jaeger for trace visualization
  jaeger:
    image: jaegertracing/all-in-one:1.55
    ports:
      - "16686:16686" # UI
      - "14268:14268" # Collector HTTP
    profiles:
      - observability

volumes:
  redis-data:
