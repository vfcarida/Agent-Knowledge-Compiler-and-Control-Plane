apiVersion: policy.akcp.dev/v1alpha1
kind: PolicyCard
metadata:
  name: "Career Domain Starter Policy"
  description: "Safeguards for career-related MCP tools, enforcing read-only behavior for personal knowledge."
appliesTo:
  capabilities: ["*"]
  riskLevels: ["critical"]
rules:
  # Career tools should not have critical risk.
  - effect: deny
spec:
  allowedTools: ["*"]
  # Personal career datasets are immutable at runtime — write/submit tools
  # are denied outright rather than merely requiring approval, since this
  # domain has no legitimate use for modifying personal knowledge at runtime.
  sideEffectRules:
    read: allow
    write: deny
    submit: deny
  piiHandling: allow-with-audit
