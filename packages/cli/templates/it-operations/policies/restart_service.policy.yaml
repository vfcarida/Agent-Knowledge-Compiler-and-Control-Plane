apiVersion: policy.akcp.dev/v1alpha1
kind: PolicyCard
metadata:
  name: "restart_service"
  description: "Controls the ability of an agent to restart a live service pod or instance."
appliesTo:
  capabilities: ["it-operations.restart_service"]
  riskLevels: ["critical"]
rules:
  - effect: require_approval
evidence:
  required: ["serviceName", "environment", "approver", "reason", "payloadHash"]
# Not yet representable in PolicyCardSchema, kept here for operators: approval
# token TTL (10 min), payload-hash binding, and single-use enforcement are
# configured at the ApprovalStore level (see mcp-automation-server/src/
# approval/), not per-policy.
