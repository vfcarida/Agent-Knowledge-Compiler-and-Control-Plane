apiVersion: policy.akcp.dev/v1alpha1
kind: PolicyCard
metadata:
  name: "IT Operations Incident Response Policy"
  description: >
    Master incident response policy for the IT Operations domain. Governs
    which agent capabilities are allowed at each incident severity level,
    what requires human approval, and what is permanently disallowed.
# Read-only / low-risk capabilities: allowed without approval.
appliesTo:
  capabilities:
    - it-operations.query_logs
    - it-operations.get_runbook
    - it-operations.create_incident
rules:
  - effect: allow
spec:
  allowedTools:
    - it-operations.query_logs
    - it-operations.get_runbook
    - it-operations.create_incident
    - it-operations.escalate_incident
    - it-operations.execute_remediation
  # escalate_incident and execute_remediation are allowed but always require
  # approval, regardless of appliesTo's narrower read-only scope above — see
  # policies/adapter.ts's "Approval requirements per tool" rule, which is
  # independent of appliesTo.
  approvalRequirements:
    - it-operations.escalate_incident
    - it-operations.execute_remediation
  evidenceRequirements:
    - "incidentSeverity"
    - "approvalTicketId"
  piiHandling: deny
evidence:
  required: ["incidentSeverity", "approvalTicketId"]
# Permanently disallowed agent behaviors — natural-language safety
# constraints, not machine-checkable tool identifiers. There is no policy
# engine feature yet that enforces free-text constraints like these; they
# remain operator/reviewer guidance until one exists:
#   - Execute any destructive action without a valid approvalTicketId
#   - Expose credentials, passwords, secrets, or tokens in any output or log
#   - Modify production database records directly
#   - Disable monitoring or alerting systems
#   - Bypass the change-window policy without documented emergency approval
#
# Per-severity capability gating (query_logs/get_runbook allowed at all
# severities; escalate_incident/execute_remediation require approval and are
# disabled below SEV-3) is also not yet representable — PolicyCardSchema has
# no severity concept. Audit requirements (allActions, 90-day retention,
# akcp.audit/v1 format) are configured at the audit-log-service level, not
# per-policy.
